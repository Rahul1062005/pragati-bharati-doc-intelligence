version: '3.8'

services:
  # PostgreSQL Service
  db:
    image: postgres:16-alpine
    container_name: pb_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doc_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Task Queue & Cache Service
  redis:
    image: redis:7-alpine
    container_name: pb_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Web Application & API Gateway
  web:
    build: .
    container_name: pb_api_service
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_NAME=Document Intelligence & Question Extraction Service
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/doc_intelligence
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-for-pragati-bharati-production-assignment-change-in-prod-12345
      - STORAGE_DIR=/app/storage_uploads
    ports:
      - "8000:8000"
    volumes:
      - ./storage_uploads:/app/storage_uploads
      - ./sample_data:/app/sample_data
      - ./sample_outputs:/app/sample_outputs

volumes:
  pgdata:
  redisdata:
